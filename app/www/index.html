<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Part 107 Prep</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="chart-bg" aria-hidden="true"></canvas>
<div id="shell">
  <header class="topbar">
    <div class="topbar-row">
      <button class="iconbtn" id="back-btn" type="button" aria-label="Back" hidden></button>
      <div class="title" id="top-title">Part 107 Prep</div>
    </div>
  </header>
  <main id="screen" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged image">
  <div class="lb-bar">
    <button type="button" class="btn btn-sm btn-ghost lb-zoom">Zoom</button>
    <button type="button" class="iconbtn lb-close" aria-label="Close"></button>
  </div>
  <div class="lb-scroll"><img alt=""></div>
</div>
<div class="modal-bg" id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/cap/core.js"></script>
<script src="js/cap/preferences.js"></script>
<script src="js/cap/browser.js"></script>
<script src="js/cap/clipboard.js"></script>
<script src="js/cap/share.js"></script>
<script src="js/cap/status-bar.js"></script>
<script src="js/cap/app.js"></script>
<script src="js/cap/splash-screen.js"></script>
<script src="js/cap/haptics.js"></script>
<script src="js/bank.js"></script>
<script src="js/content.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/exam.js"></script>
</body>
</html>
