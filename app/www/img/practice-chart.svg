  <path d="M440,0 L900,0 L900,210 C800,230 720,180 640,215 C560,250 500,210 440,240 Z" fill="#e3d4a4" opacity="0.5"/>
  <path d="M560,260 C640,250 700,300 760,280 C820,260 860,300 900,290 L900,620 L520,620 C540,520 520,420 560,260 Z" fill="#dfe7b3" opacity="0.35"/>

