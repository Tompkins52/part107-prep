<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="pc-title pc-desc">
  <title id="pc-title">Practice sectional chart excerpt (fictional, not for navigation)</title>
  <desc id="pc-desc">A fictional VFR sectional excerpt showing Riverton Regional, a towered airport inside Class D airspace with a 3,100 ft MSL ceiling and a surrounding Class E 700 ft transition area; Millbrook, a non-towered airport inside a Class E surface area; restricted area R-4071; the Badger MOA; a VOR; a Victor airway; obstacles; a private airport; a heliport; a parachute jumping area; and maximum elevation figures in each quadrangle.</desc>
  <defs>
    <pattern id="hatchB" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2a63c8" stroke-width="1.3"/>
    </pattern>
    <pattern id="hatchM" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c83a84" stroke-width="1.3"/>
    </pattern>
    <radialGradient id="vignetteE" cx="300" cy="350" r="178" gradientUnits="userSpaceOnUse">
      <stop offset="0.83" stop-color="#e05a9b" stop-opacity="0"/>
      <stop offset="1" stop-color="#e05a9b" stop-opacity="0.34"/>
    </radialGradient>
    <clipPath id="clipR"><polygon points="40,40 230,40 262,150 120,212 40,172"/></clipPath>
    <clipPath id="clipMOA"><polygon points="600,40 880,40 880,122 640,152"/></clipPath>
  </defs>

  <!-- Chart paper -->
  <rect width="900" height="620" fill="#f4ecd8"/>

