  <g fill="none" stroke="#b98c5a" stroke-width="1" opacity="0.55">
    <path d="M0,460 C80,420 140,470 220,440 C300,410 360,470 440,450 C500,436 540,470 600,460"/>
    <path d="M0,500 C90,470 150,520 230,490 C320,455 370,520 450,495"/>
    <path d="M0,560 C100,530 160,580 240,555 C320,530 390,585 470,560 C550,535 600,580 660,560"/>
    <path d="M520,0 C560,60 640,70 700,40 C760,10 820,50 900,30"/>
    <path d="M460,120 C520,150 600,120 660,160 C720,200 800,170 900,200"/>
    <path d="M620,320 C680,300 740,340 800,320 C840,306 870,330 900,320"/>
    <path d="M600,600 C660,570 720,610 780,580 C840,552 870,590 900,575"/>
  </g>

