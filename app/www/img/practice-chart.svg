  <path d="M900,250 C830,280 790,330 740,350 C690,370 650,420 600,470 C560,510 520,560 480,620" fill="none" stroke="#8fc2e6" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M110,250 C140,232 185,240 196,270 C206,298 170,318 138,310 C105,302 92,268 110,250 Z" fill="#8fc2e6" opacity="0.9"/>
  <text x="150" y="282" font-size="9" fill="#2a5e8a" text-anchor="middle" font-style="italic">Bass Lake</text>

  <!-- Roads -->
  <g fill="none" stroke="#6b5a40" stroke-width="1.6" opacity="0.8">
